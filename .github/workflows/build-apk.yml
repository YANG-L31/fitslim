name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with kivy/buildozer
        run: |
          mkdir -p "$HOME/.buildozer"
          docker run --rm \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            ghcr.io/kivy/buildozer:latest android debug

      - name: Show output
        if: always()
        run: ls -la bin || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fitslim-apk
          path: bin/*.apk
          if-no-files-found: error
